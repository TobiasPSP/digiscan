schema_version: 1
device:
  id: ip2368
  name: IP2368 v1.0
  profile_revision: 1
  typical_addresses:
  - 117
  address: 117
  register_address_bytes: 1
filter_lists:
  - name: USB Direction
    registers: [0x0B, 0x31, 0x33, 0x34, 0x38]
reports:
  - header: All
    groups:
      - header: null
        items: [All]
  - header: Battery
    groups:
      - header: Overview
        items: [0x50_1111111111111111, 0x6E_1111111111111111, 0x03_01111111]
identification:
  - register: 0x04
    mask: 0x7F
    min: 0
    max: 127
    class: C
    source: IP2368 V1.61 p6; bits 6:0 FCAP = N * 200 mAh, bit 7 is enable
    label: Capacity code; all seven-bit codes compatible, not distinguishing
graphs:
  - header: Battery
    lines:
      - property: 0x50_1111111111111111
        min: 0
        max: 30000
        color: 0x60D4E3
        area: false
      - property: 0x6E_1111111111111111
        min: 0
        max: 10000
        color: 0xFFCD70
        area: false
provenance:
  reference_url: ""
  manual: IP2368 register description V1.61, 2022-07-13, 21 pages
  manual_sha256: A04327A4B396D3B416549AA105CAFB4C8F02143A36D0C015275DF359461577DC
  scope: IP2368_I2C_COUT and IP2368_I2C_NACT only (page 3)
  derived: 2026-10-09
  baseline: User-supplied translated original manual; no assumed equivalence with IP2366/IP2369. Unresolved translation and context dependencies remain explicit.
transport:
  passive_only: false
  active_read:
    protocol: single_byte_pointer_restart
    clock_Hz: 10000
    max_registers: 3
policy:
  assembly: Consecutive low-first target reads, per address; tablet maximum group arrival gap 1 s
  physical_units: Documented conversion once into mV, mA, mW, mAh, uA or percent. Context-dependent settings retain codes or chemistry-qualified choices.
