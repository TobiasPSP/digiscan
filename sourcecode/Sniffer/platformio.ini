[platformio]
default_envs = weact_rp2350b_headless

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/check_memory.py
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -fstack-usage

[env:weact_rp2350b_headless]
board = weact_rp2350b_core
build_flags =
  ${env.build_flags}
  -D SNIFFER_HEADLESS=1
  -D I2C_SNIFF_SDA_PIN=30
  -D I2C_SNIFF_SCL_PIN=31
  -D SNIFFER_BUTTON_PIN=27
  -D SNIFFER_LED_PIN=25
  -D SNIFFER_LED_ACTIVE_LOW=1

[env:rp2040_zero]
board = waveshare_rp2040_zero
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  adafruit/Adafruit NeoPixel@1.15.5
build_flags =
  ${env.build_flags}
  -D SNIFFER_HEADLESS=0
  -D USER_SETUP_LOADED
  -D ST7789_DRIVER
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_WIDTH=172
  -D TFT_HEIGHT=320
  -D TFT_MOSI=11
  -D TFT_SCLK=10
  -D TFT_SPI_PORT=1
  -D TFT_MISO=-1
  -D TFT_SPI_MODE=0
  -D TFT_DC=12
  -D TFT_CS=13
  -D TFT_RST=14
  -D LOAD_GLCD
  -D SPI_FREQUENCY=27000000
  -D I2C_SNIFF_SDA_PIN=4
  -D I2C_SNIFF_SCL_PIN=5
  -D TFT_BL_PIN=15
  -D I2C_SNIFF_ENABLE_BOOTSEL_BUTTON=1
