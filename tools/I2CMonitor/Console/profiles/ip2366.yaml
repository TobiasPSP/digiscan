properties:
  - id: r00_en_loadotp
    friendlydesc: "When 1, default settings are reloaded at startup or wake; when 0, settings are retained."
    name: En_LOADOTP
    registers:
      - 0x00
    operation: read_write
    assembly: single
    encoding: uint
    mask: 0x80
    shift: 7
    scale: 1
    offset: 0
    unit: code
    precision: 0
    enum: {}
    valid_min: 0
    valid_max: 1
    evidence: A/B
    note: ""
    description: 1 reloads defaults on boot/wake; 0 retains settings through that mechanism. Manual discourages clearing without suitable reinitialization logic.
    access: R/W
    bit_meanings:
      "0":
        status: "NO"
        interpretation: No default-register reload at boot/wake
      "1":
        status: "YES"
        interpretation: Default-register reload at boot/wake enabled
  - id: r00_en_resetmcu
    friendlydesc: "Writing 1 requests default-register restoration; the bit then clears itself. Zero does not confirm completion."
    name: En_RESETMCU
