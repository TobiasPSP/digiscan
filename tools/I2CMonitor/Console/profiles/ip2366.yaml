    assembly: single
    encoding: uint
    mask: 0x40
    shift: 6
    scale: 1
    offset: 0
    unit: code
    precision: 0
    enum: {}
    valid_min: 0
    valid_max: 1
    evidence: A/B
    note: ""
    description: Write 1 to reset registers to defaults; self-clears. Wait 2 s per A.
    access: R/W
    bit_meanings:
      "0":
        status: "NO"
        interpretation: No reset request asserted; does not prove completion
      "1":
        status: "YES"
        interpretation: Reset-to-defaults request; self-clears; wait 2 s after reset
